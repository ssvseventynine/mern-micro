# =========================================================================
# 7. GATEWAY TIER: Custom ExpressJS API Gateway
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: express-gateway
  template:
    metadata:
      labels:
        app: express-gateway
    spec:
      containers:
      - name: express-gateway
        image: mernmicroreg2026-bpaacgcugvh6egca.azurecr.io/express-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: CONSUL_HOST
          value: "consul"
        - name: SERVER_PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: express-gateway
spec:
  selector:
    app: express-gateway
  # We use LoadBalancer type here so Azure gives us a Public IP Address for the backend entry point
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
# =========================================================================
# 8. PRESENTATION TIER: React Frontend Dashboard UI
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-frontend
  template:
    metadata:
      labels:
        app: react-frontend
    spec:
      containers:
      - name: react-frontend
        image: mernmicroreg2026-bpaacgcugvh6egca.azurecr.io/react-frontend:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: react-frontend
  # We use LoadBalancer type here to expose your actual web browser GUI dashboard to the public internet!
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000