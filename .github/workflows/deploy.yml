name: Build and Push Microservices to Azure

on:
  push:
    branches:
      - main  # Triggers automatically whenever you sync changes to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your source code onto the GitHub runner machine
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Step 2: Log directly into your Azure Container Registry using secrets
    - name: Login to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # Step 3: Build and Push User Microservice
    - name: Build & Push User Service
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/user-service:latest ./user-service
        docker push ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/user-service:latest

    # Step 4: Build and Push Product Microservice
    - name: Build & Push Product Service
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/product-service:latest ./product-service
        docker push ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/product-service:latest

    # Step 5: Build and Push Order Microservice
    - name: Build & Push Order Service
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/order-service:latest ./order-service
        docker push ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/order-service:latest

    # Step 6: Build and Push Notification Microservice
    - name: Build & Push Notification Service
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/notification-service:latest ./notification-service
        docker push ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/notification-service:latest

    # Step 7: Build and Push API Gateway Proxy
    - name: Build & Push API Gateway
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/express-gateway:latest ./gateway
        docker push ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/express-gateway:latest

    # Step 8: Build and Push React Dashboard UI
    - name: Build & Push Frontend UI
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/react-frontend:latest ./frontend
        docker push ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/react-frontend:latest